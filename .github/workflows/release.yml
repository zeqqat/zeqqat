name: Release

# Releasing is just bumping "version" in package.json and pushing to main.
# When main has a version with no v<version> tag yet, this tags the commit,
# publishes a GitHub release with generated notes, and builds the image to
# ghcr.io/zeqqat/zeqqat as <version>, <major>.<minor> and latest. A
# pre-release version like 0.3.0-rc.1 publishes only its own tag, never
# latest. Pushing a v*.*.* tag by hand still builds that version.
on:
  push:
    branches: [main]
    paths: ["package.json"]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes $prerelease
          echo "release=true" >> "$GITHUB_OUTPUT"

  image:
    name: image
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

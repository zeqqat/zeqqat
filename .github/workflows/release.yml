name: Release

# Releasing is just bumping "version" in package.json and pushing to main.
# When main has a version with no v<version> tag yet, this tags the commit,
# publishes a GitHub release with generated notes, and builds the image to
# ghcr.io/zeqqat/zeqqat as <version>, <major>.<minor> and latest. A
# pre-release version like 0.3.0-rc.1 publishes only its own tag, never
# latest. Pushing a v*.*.* tag by hand still builds that version.
on:
  push:
    branches: [main]
    paths: ["package.json"]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes $prerelease
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Each platform builds natively on its own runner, side by side (arm64 on
  # GitHub's free ARM runners for public repos instead of QEMU emulation,
  # which made a release take ~11 minutes). Each pushes its image by digest;
  # `image` then joins them into one multi-platform tag.
  build:
    name: build (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: arch
        run: echo "name=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.name }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.arch.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: image
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, '-') }}
      - name: Join the platform images into one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
